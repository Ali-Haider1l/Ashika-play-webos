name: Build LG webOS IPK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate application files
        run: |
          node --check js/app.js
          node -e "JSON.parse(require('fs').readFileSync('appinfo.json', 'utf8'))"
          test -s index.html
          test -s css/app.css
      - name: Install webOS CLI
        run: npm install --global @webosose/ares-cli
      - name: Generate required webOS PNG icon
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          convert icon.svg -resize 80x80 icon.png
          test -s icon.png
      - name: Package app
        run: ares-package .
      - name: Upload IPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ashika-play-webos-v1.2.1
          path: '*.ipk'
          if-no-files-found: error
