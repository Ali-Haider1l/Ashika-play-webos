name: Build LG webOS IPK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install webOS CLI
        run: npm install --global @webosose/ares-cli
      - name: Package app
        run: ares-package .
      - name: Upload IPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ashika-play-webos-ipk
          path: '*.ipk'
          if-no-files-found: error
